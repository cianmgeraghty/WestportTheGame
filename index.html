<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#081b2d" />
  <meta name="description" content="Westport: The Game — explore a living digital Westport." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/westport-logo.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Westport: The Game</title>
</head>
<body>
  <main id="landing" class="landing">
    <img class="logo" src="assets/westport-logo.png" alt="Westport The Game logo with a clock tower and mountain" />
    <p class="eyebrow">A living digital Westport</p>
    <h1>Walk the town.<br /><span>Make it yours.</span></h1>
    <p class="lede">A stylised open-world adventure set in the streets of Westport, Co. Mayo.</p>
    <button id="install" class="primary" hidden>Install the app</button>
    <button id="launch" class="secondary">Play the prototype</button>
    <p id="installHint" class="hint">Add this page to your home screen for the app experience.</p>
  </main>

  <main id="game" class="game" hidden>
    <header class="hud"><button id="back" class="icon-button" aria-label="Back to home">←</button><div><strong>WESTPORT</strong><small>PROTOTYPE 0.1</small></div><button id="reset" class="icon-button" aria-label="Reset position">↻</button></header>
    <canvas id="map" aria-label="Playable Westport prototype map"></canvas>
    <div class="location"><span class="pulse"></span><span id="place">Bridge Street</span><span class="dot">•</span><span id="mode">ON FOOT</span></div>
    <div id="joystick" class="joystick"><div class="stick"></div></div>
    <button id="drive" class="drive-button">GET IN CAR</button>
    <div class="legend"><span><i class="you"></i>You</span><span><i class="car"></i>Car</span></div>
  </main>
  <script src="app.js"></script><script src="interaction-fix.js"></script>
</body>
</html>
